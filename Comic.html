<DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComicCraft - AI Comic Story Creator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f1ff;
            color: #222;
        }

        header {
            background: #6c3cff;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 28px;
        }

        header span {
            font-size: 14px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .hero {
            text-align: center;
            margin-bottom: 30px;
        }

        .hero h2 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .hero p {
            color: #666;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #6c3cff;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5427d6;
        }

        .comic-result {
            display: none;
        }

        .scene {
            border: 3px solid #222;
            padding: 20px;
            margin-top: 20px;
            border-radius: 12px;
            background: #fff;
        }

        .scene h3 {
            margin-bottom: 10px;
            color: #6c3cff;
        }

        .scene p {
            line-height: 1.6;
        }

        .download {
            margin-top: 20px;
            background: #222;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        @media (max-width: 600px) {
            .hero h2 {
                font-size: 28px;
            }

            header {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🎨 ComicCraft</h1>
    <span>AI Comic Story Creator</span>
</header>

<div class="container">

    <section class="hero">
        <h2>Create Your Own AI Comic</h2>
        <p>Turn your imagination into an amazing comic story.</p>
    </section>

    <div class="card">

        <label for="title">Comic Title</label>
        <input
            type="text"
            id="title"
            placeholder="Enter your comic title"
        >

        <label for="idea">Story Idea</label>
        <textarea
            id="idea"
            placeholder="Example: A young hero discovers a mysterious power..."
        ></textarea>

        <label for="genre">Genre</label>
        <select id="genre">
            <option>Adventure</option>
            <option>Fantasy</option>
            <option>Science Fiction</option>
            <option>Comedy</option>
            <option>Superhero</option>
            <option>Mystery</option>
        </select>

        <label for="duration">Story Length</label>
        <select id="duration">
            <option>Short</option>
            <option>Medium</option>
            <option>Long</option>
        </select>

        <button onclick="generateComic()">
            ✨ Generate Comic
        </button>

    </div>

    <div class="card comic-result" id="result">

        <h2 id="comicTitle"></h2>

        <div id="scenes"></div>

        <button class="download" onclick="downloadComic()">
            ⬇️ Download Comic
        </button>

    </div>

</div>

<footer>
    © 2026 ComicCraft | AI Comic Story Creator
</footer>

<script>

function generateComic() {

    const title = document.getElementById("title").value;
    const idea = document.getElementById("idea").value;
    const genre = document.getElementById("genre").value;

    if (title === "" || idea === "") {
        alert("Please enter the comic title and story idea.");
        return;
    }

    document.getElementById("result").style.display = "block";

    document.getElementById("comicTitle").innerText =
        "📖 " + title;

    const scenes = document.getElementById("scenes");

    scenes.innerHTML = `
        <div class="scene">
            <h3>Scene 1 – The Beginning</h3>
            <p>
                ${idea}
            </p>
            <p><strong>Genre:</strong> ${genre}</p>
        </div>

        <div class="scene">
            <h3>Scene 2 – The Adventure</h3>
            <p>
                The main character begins an exciting journey and
                discovers something unexpected.
            </p>
        </div>

        <div class="scene">
            <h3>Scene 3 – The Challenge</h3>
            <p>
                A difficult challenge appears. The hero must use
                courage and intelligence to overcome it.
            </p>
        </div>

        <div class="scene">
            <h3>Scene 4 – The Ending</h3>
            <p>
                After overcoming the challenge, the hero completes
                the journey and returns with a new understanding.
            </p>
        </div>
    `;

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });
}


function downloadComic() {

    const title = document.getElementById("title").value;

    const content = document.getElementById("scenes").innerText;

    const file = new Blob(
        [title + "\n\n" + content],
        { type: "text/plain" }
    );

    const link = document.createElement("a");

    link.href = URL.createObjectURL(file);

    link.download = title + "-Comic.txt";

    link.click();

    URL.revokeObjectURL(link.href);
}

</script>

</body>
</html>
